<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteamDrop Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d121d;
            --card-bg: #1b2838;
            --accent-blue: #66c0f4;
            --text-color: #f3f3f3;
            --text-muted: #8f98a0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            user-select: none;
        }
        .header {
            position: relative;
            background: linear-gradient(135deg, #171a21, #2a475e);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 16px;
            border: 1px solid rgba(102, 192, 244, 0.2);
        }
        .title { font-size: 22px; font-weight: bold; margin-bottom: 6px; color: var(--accent-blue); }
        .subtitle { font-size: 13px; color: var(--text-muted); }
        .balance-box {
            font-size: 34px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(102, 192, 244, 0.6);
            margin: 10px 0;
        }
        .balance-box span { color: var(--accent-blue); }
        .section-title { font-size: 16px; font-weight: 700; margin: 20px 0 12px; color: #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.15s;
            cursor: pointer;
        }
        .card:active { transform: scale(0.95); }
        .card-icon { font-size: 30px; margin-bottom: 8px; }
        .card-title { font-size: 14px; font-weight: bold; }
        .card-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .daily-card {
            background: linear-gradient(135deg, #2a475e, #1b2838);
            border: 1px solid var(--accent-blue);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">🎮 SteamDrop</div>
        <div class="subtitle">Твой баланс:</div>
        <div class="balance-box"><span id="balance">0</span> 💎</div>
        <div class="subtitle">1000 💎 ≈ $1.00 Steam Gift Card</div>
    </div>

    <div class="section-title">⚡ Задания и бонус</div>
    <div class="grid">
        <div class="card daily-card" onclick="claimDailyDrop()">
            <div class="card-icon">🔥</div>
            <div class="card-title">Серия Дропов</div>
            <div class="card-sub" id="streak-text">от 30 и больше 💎</div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Актуальный адрес ngrok-туннеля
        const SERVER_URL = "https://swan-prissy-poking.ngrok-free.dev"; 

        function notify(text) {
            if (tg && tg.showAlert) {
                tg.showAlert(text);
            } else {
                alert(text);
            }
        }

        // Автоматическая загрузка профиля при открытии Mini App
        async function loadUserData() {
            let userId = tg.initDataUnsafe?.user?.id;
            if (!userId) return;

            try {
                let response = await fetch(`${SERVER_URL}/api/user?user_id=${userId}`);
                let result = await response.json();

                if (result.success) {
                    document.getElementById("balance").innerText = result.balance;
                    if (result.streak_days > 0) {
                        document.getElementById("streak-text").innerText = `Стрик: ${result.streak_days} дн.`;
                    }
                }
            } catch (e) {
                console.error("Ошибка загрузки профиля:", e);
            }
        }

        async function claimDailyDrop() {
            let userId = tg.initDataUnsafe?.user?.id;
            
            if (!userId) {
                notify("Ошибка: Запустите приложение внутри Telegram!");
                return;
            }

            try {
                let response = await fetch(`${SERVER_URL}/api/claim`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: userId })
                });

                let result = await response.json();

                if (result.success) {
                    document.getElementById("balance").innerText = result.new_balance;
                    document.getElementById("streak-text").innerText = `Стрик: ${result.streak} дн.`;
                    notify(result.message);
                } else {
                    notify(result.message);
                }
            } catch (e) {
                notify("Ошибка подключения к серверу!");
            }
        }

        // Запуск первичной загрузки баланса
        loadUserData();
    </script>
</body>
</html>
