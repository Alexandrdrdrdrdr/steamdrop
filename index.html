<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteamDrop Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d121d;
            --card-bg: #1b2838;
            --accent-blue: #66c0f4;
            --accent-green: #5c7e10;
            --text-color: #f3f3f3;
            --text-muted: #8f98a0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 16px 16px 80px 16px;
            user-select: none;
        }
        .header {
            position: relative;
            background: linear-gradient(135deg, #171a21, #2a475e);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 16px;
            border: 1px solid rgba(102, 192, 244, 0.2);
        }
        .title { font-size: 22px; font-weight: bold; margin-bottom: 6px; color: var(--accent-blue); }
        .subtitle { font-size: 13px; color: var(--text-muted); }
        .balance-box {
            font-size: 34px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(102, 192, 244, 0.6);
            margin: 10px 0;
        }
        .balance-box span { color: var(--accent-blue); }

        /* Навигация переключения окон */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-title { font-size: 16px; font-weight: 700; margin: 20px 0 12px; color: #fff; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.15s;
            cursor: pointer;
        }
        .card:active { transform: scale(0.98); }
        .card-icon { font-size: 36px; margin-bottom: 8px; }
        .card-title { font-size: 16px; font-weight: bold; }
        .card-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .daily-card {
            background: linear-gradient(135deg, #2a475e, #1b2838);
            border: 1px solid var(--accent-blue);
        }

        /* Кнопка апгрейда */
        .btn-upgrade {
            margin-top: 14px;
            background: linear-gradient(135deg, #a4d007, #5c7e10);
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(92, 126, 16, 0.4);
            width: 100%;
        }

        /* Нижнее меню */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #171a21;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
        }
        .nav-item {
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            flex: 1;
        }
        .nav-item.active {
            color: var(--accent-blue);
            font-weight: bold;
        }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <!-- Общая шапка с балансом -->
    <div class="header">
        <div class="title">🎮 SteamDrop</div>
        <div class="subtitle">Твой баланс:</div>
        <div class="balance-box"><span id="balance">...</span> 💎</div>
        <div class="subtitle">1000 💎 ≈ $1.00 Steam Gift Card</div>
    </div>

    <!-- Вкладка 1: Главная -->
    <div id="tab-main" class="tab-content active">
        <div class="section-title">⚡ Ежедневный Бонус</div>
        <div class="grid">
            <div class="card daily-card" onclick="claimDailyDrop()">
                <div class="card-icon">🔥</div>
                <div class="card-title">Забрать Дроп</div>
                <div class="card-sub" id="streak-text">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Вкладка 2: Апгрейд Валюты -->
    <div id="tab-upgrade" class="tab-content">
        <div class="section-title">🚀 Прокачка дохода</div>
        <div class="card">
            <div class="card-icon">💎</div>
            <div class="card-title">Уровень Валюты: <span id="upgrade-lvl">1</span></div>
            <div class="card-sub" id="upgrade-bonus-text">Текущий бонус: +0 💎/день</div>
            <button class="btn-upgrade" onclick="buyUpgrade()">
                Улучшить за <span id="upgrade-cost">150</span> 💎
            </button>
        </div>
    </div>

    <!-- Нижняя панели навигации -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('main', this)">
            <div class="nav-icon">🏠</div>
            Главная
        </div>
        <div class="nav-item" onclick="switchTab('upgrade', this)">
            <div class="nav-icon">⚡</div>
            Апгрейд
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const SERVER_URL = "https://swan-prissy-poking.ngrok-free.dev"; 

        function notify(text) {
            if (tg && tg.showAlert) {
                tg.showAlert(text);
            } else {
                alert(text);
            }
        }

        // Переключение окон
        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            el.classList.add('active');
        }

        async function loadUserData() {
            let userId = tg.initDataUnsafe?.user?.id;
            
            if (!userId) {
                document.getElementById("balance").innerText = "0";
                document.getElementById("streak-text").innerText = "Запустите в Telegram";
                return;
            }

            try {
                let response = await fetch(`${SERVER_URL}/api/user?user_id=${userId}`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });
                let result = await response.json();

                if (result.success) {
                    document.getElementById("balance").innerText = result.balance;
                    document.getElementById("streak-text").innerText = result.streak_days > 0 
                        ? `Стрик: ${result.streak_days} дн.` 
                        : "Забрать бонус";
                    
                    // Обновляем данные прокачки
                    document.getElementById("upgrade-lvl").innerText = result.upgrade_level;
                    document.getElementById("upgrade-cost").innerText = result.upgrade_cost;
                    document.getElementById("upgrade-bonus-text").innerText = `Текущий бонус: +${result.upgrade_bonus} 💎 к дропу`;
                } else {
                    notify("Ошибка загрузки: " + result.message);
                }
            } catch (e) {
                notify("Ошибка подключения к серверу!");
            }
        }

        async function claimDailyDrop() {
            let userId = tg.initDataUnsafe?.user?.id;
            if (!userId) { notify("Запустите в Telegram!"); return; }

            try {
                let response = await fetch(`${SERVER_URL}/api/claim`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "ngrok-skip-browser-warning": "true"
                    },
                    body: JSON.stringify({ user_id: userId })
                });

                let result = await response.json();

                if (result.success) {
                    document.getElementById("balance").innerText = result.new_balance;
                    document.getElementById("streak-text").innerText = `Стрик: ${result.streak} дн.`;
                    notify(result.message);
                } else {
                    notify(result.message);
                }
            } catch (e) {
                notify("Ошибка подключения к серверу!");
            }
        }

        async function buyUpgrade() {
            let userId = tg.initDataUnsafe?.user?.id;
            if (!userId) { notify("Запустите в Telegram!"); return; }

            try {
                let response = await fetch(`${SERVER_URL}/api/upgrade`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "ngrok-skip-browser-warning": "true"
                    },
                    body: JSON.stringify({ user_id: userId })
                });

                let result = await response.json();

                if (result.success) {
                    document.getElementById("balance").innerText = result.new_balance;
                    document.getElementById("upgrade-lvl").innerText = result.upgrade_level;
                    document.getElementById("upgrade-cost").innerText = result.upgrade_cost;
                    document.getElementById("upgrade-bonus-text").innerText = `Текущий бонус: +${result.upgrade_bonus} 💎 к дропу`;
                    notify(result.message);
                } else {
                    notify(result.message);
                }
            } catch (e) {
                notify("Ошибка покупки прокачки!");
            }
        }

        loadUserData();
    </script>
</body>
</html>
