<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteamDrop Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d121d;
            --card-bg: #1b2838;
            --accent-blue: #66c0f4;
            --accent-green: #5c7e10;
            --text-color: #f3f3f3;
            --text-muted: #8f98a0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            user-select: none;
        }
        .header {
            background: linear-gradient(135deg, #171a21, #2a475e);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 16px;
            border: 1px solid rgba(102, 192, 244, 0.2);
        }
        .title { font-size: 22px; font-weight: bold; margin-bottom: 6px; color: var(--accent-blue); }
        .subtitle { font-size: 13px; color: var(--text-muted); }
        .balance-box {
            font-size: 34px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(102, 192, 244, 0.6);
            margin: 10px 0;
        }
        .balance-box span { color: var(--accent-blue); }
        .btn-main {
            width: 100%;
            background: linear-gradient(90deg, #a4d007, #537e00);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(83, 126, 0, 0.4);
            transition: transform 0.1s;
        }
        .btn-main:active { transform: scale(0.97); }
        .section-title { font-size: 16px; font-weight: 700; margin: 20px 0 12px; color: #fff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.15s;
        }
        .card:active { transform: scale(0.95); }
        .card-icon { font-size: 30px; margin-bottom: 8px; }
        .card-title { font-size: 14px; font-weight: bold; }
        .card-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">🎮 SteamDrop</div>
        <div class="subtitle">Твой баланс:</div>
        <div class="balance-box"><span id="balance">0</span> 💎</div>
        <div class="subtitle">1000 💎 ≈ $1.00 Steam Gift Card</div>
    </div>

    <button class="btn-main" onclick="claimDaily()">🎁 Забрать дневной бонус (+50 💎)</button>

    <div class="section-title">⚡ Задания и раздел фарма</div>
    <div class="grid">
        <div class="card" onclick="alert('Подписки на каналы появятся скоро!')">
            <div class="card-icon">📲</div>
            <div class="card-title">Подписки</div>
            <div class="card-sub">+15 💎 / канал</div>
        </div>
        <div class="card" onclick="alert('Опросы CPX Research подключатся следующим шагом!')">
            <div class="card-icon">📋</div>
            <div class="card-title">Опросы</div>
            <div class="card-sub">до +500 💎</div>
        </div>
        <div class="card" onclick="alert('Приглашай друзей через /start реф-ссылку!')">
            <div class="card-icon">👥</div>
            <div class="card-title">Друзья</div>
            <div class="card-sub">+15% от друзей</div>
        </div>
        <div class="card" onclick="alert('Минимальный вывод: 1000 💎')">
            <div class="card-icon">🎁</div>
            <div class="card-title">Вывод</div>
            <div class="card-sub">Steam Карты</div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = localStorage.getItem('userBalance') || 0;
        document.getElementById('balance').innerText = balance;

        function claimDaily() {
            balance = parseInt(balance) + 50;
            document.getElementById('balance').innerText = balance;
            localStorage.setItem('userBalance', balance);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            alert('Вы получили +50 💎!');
        }
    </script>
</body>
</html>
