<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteamDrop Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>SteamDrop Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      const SERVER_URL = "https://swan-prissy-poking.ngrok-free.dev";
    </script>
    <style>
      :root {
    <style>
        :root {
            --bg-color: #0d121d;
            --card-bg: #1b2838;
            --accent-blue: #66c0f4;
            --accent-yellow: #ffc107;
            --text-color: #f3f3f3;
            --text-muted: #8f98a0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 16px 16px 80px 16px;
            user-select: none;
        }
        .header {
            background: linear-gradient(135deg, #171a21, #2a475e);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 16px;
            border: 1px solid rgba(102, 192, 244, 0.2);
        }
        .title { font-size: 20px; font-weight: bold; color: var(--accent-blue); }
        .subtitle { font-size: 12px; color: var(--text-muted); }
        .balance-box {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(102, 192, 244, 0.6);
            margin: 6px 0;
        }
        .balance-box span { color: var(--accent-blue); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section-title { font-size: 16px; font-weight: 700; margin: 16px 0 10px; text-align: center; }
        
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Стиль для CSGO Upgrade Колеса */
        .wheel-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 15px auto;
            border-radius: 50%;
            background: #171a21;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        .wheel-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(var(--accent-blue) 0% 45%, #2a3f5a 45% 100%);
            transition: background 0.3s ease;
        }
        .wheel-inner {
            position: absolute;
            width: 140px;
            height: 140px;
            background: #0d121d;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .wheel-arrow {
            position: absolute;
            top: 5px;
            width: 4px;
            height: 85px;
            background: var(--accent-yellow);
            transform-origin: bottom center;
            z-index: 3;
            transition: transform 3s cubic-bezier(0.15, 0.9, 0.2, 1);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--accent-yellow);
        }

        /* Инпуты апгрейдера */
        .upgrader-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .input-box {
            background: #101823;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px;
            text-align: left;
        }
        .input-box label { font-size: 10px; color: var(--text-muted); display: block; }
        .input-box input {
            width: 90%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            outline: none;
        }

        .mult-btns {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin: 12px 0;
        }
        .mult-btn {
            flex: 1;
            background: #171a21;
            border: 1px solid rgba(102, 192, 244, 0.3);
            color: var(--text-color);
            padding: 6px 0;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .mult-btn.active {
            background: var(--accent-blue);
            color: #000;
        }

        .btn-upgrade {
            background: linear-gradient(135deg, #ffc107, #ff8800);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
        }

        /* Навигация */
        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #171a21;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-item {
            color: var(--text-muted);
            font-size: 11px;
            text-align: center;
            cursor: pointer;
            flex: 1;
        }
        .nav-item.active { color: var(--accent-blue); font-weight: bold; }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">🎮 SteamDrop</div>
        <div class="subtitle">Твой баланс:</div>
        <div class="balance-box"><span id="balance">...</span> 💎</div>
    </div>

    <!-- Вкладка 1: Главная -->
    <div id="tab-main" class="tab-content active">
        <div class="section-title">⚡ Ежедневный Бонус</div>
        <div class="card" onclick="claimDailyDrop()" style="cursor: pointer;">
            <div style="font-size: 40px; margin-bottom: 6px;">🔥</div>
            <div style="font-size: 16px; font-weight: bold;">Забрать Дроп</div>
            <div class="subtitle" id="streak-text" style="margin-top: 4px;">Загрузка...</div>
        </div>
    </div>

    <!-- Вкладка 2: CSGO Upgrader -->
    <div id="tab-upgrade" class="tab-content">
        <div class="section-title">⚡ Апгрейдер Баланса</div>
        <div class="card">
            
            <div class="wheel-container">
                <div class="wheel-ring" id="wheel-ring"></div>
                <div class="wheel-arrow" id="wheel-arrow"></div>
                <div class="wheel-inner">
                    <span style="font-size: 11px; color: var(--text-muted);">Шанс</span>
                    <span id="chance-display" style="font-size: 22px; font-weight: 800; color: var(--accent-yellow);">45%</span>
                </div>
            </div>

            <div class="mult-btns">
                <button class="mult-btn active" onclick="setMultiplier(1.5, this)">x1.5</button>
                <button class="mult-btn" onclick="setMultiplier(2.0, this)">x2.0</button>
                <button class="mult-btn" onclick="setMultiplier(5.0, this)">x5.0</button>
                <button class="mult-btn" onclick="setMultiplier(10.0, this)">x10.0</button>
            </div>

            <div class="upgrader-inputs">
                <div class="input-box">
                    <label>Ставка (💎)</label>
                    <input type="number" id="bet-input" value="100" oninput="updateCalculations()">
                </div>
                <div class="input-box">
                    <label>Выиграешь (💎)</label>
                    <input type="number" id="target-input" value="200" oninput="updateCalculationsFromTarget()">
                </div>
            </div>

            <br>
            <button class="btn-upgrade" id="upgrade-btn" onclick="playUpgrade()">🚀 ПРОКАЧАТЬ</button>
        </div>
    </div>

    <!-- Навигация -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('main', this)">
            <div class="nav-icon">🏠</div>
            Главная
        </div>
        <div class="nav-item" onclick="switchTab('upgrade', this)">
            <div class="nav-icon">⚡</div>
            Апгрейдер
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const SERVER_URL = "https://swan-prissy-poking.ngrok-free.dev"; 
        let currentMultiplier = 2.0;
        let isSpinning = false;

        function notify(text) {
            if (tg && tg.showAlert) tg.showAlert(text);
            else alert(text);
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            el.classList.add('active');
        }

        function setMultiplier(mult, btn) {
            currentMultiplier = mult;
            document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            let bet = parseInt(document.getElementById('bet-input').value) || 0;
            document.getElementById('target-input').value = Math.round(bet * mult);
            updateCalculations();
        }

        function updateCalculations() {
            let bet = parseInt(document.getElementById('bet-input').value) || 0;
            let target = parseInt(document.getElementById('target-input').value) || 0;

            if (bet > 0 && target > bet) {
                let chance = Math.min(90.0, Math.max(0.5, (bet / target) * 90.0));
                document.getElementById('chance-display').innerText = chance.toFixed(1) + '%';
                
                // Обновляем визуал круга
                document.getElementById('wheel-ring').style.background = 
                    `conic-gradient(var(--accent-blue) 0% ${chance}%, #2a3f5a ${chance}% 100%)`;
            } else {
                document.getElementById('chance-display').innerText = '0%';
            }
        }

        function updateCalculationsFromTarget() {
            let bet = parseInt(document.getElementById('bet-input').value) || 0;
            let target = parseInt(document.getElementById('target-input').value) || 0;
            if (bet > 0) updateCalculations();
        }

        async function loadUserData() {
            let userId = tg.initDataUnsafe?.user?.id;
            if (!userId) return;

            try {
                let response = await fetch(`${SERVER_URL}/api/user?user_id=${userId}`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });
                let result = await response.json();

                if (result.success) {
                    document.getElementById("balance").innerText = result.balance;
                    document.getElementById("streak-text").innerText = result.streak_days > 0 
                        ? `Стрик: ${result.streak_days} дн.` 
                        : "Забрать бонус";
                }
            } catch (e) {}
        }

        async function claimDailyDrop() {
            let userId = tg.initDataUnsafe?.user?.id;
            if (!userId) return notify("Запустите в Telegram!");

            try {
                let response = await fetch(`${SERVER_URL}/api/claim`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
                    body: JSON.stringify({ user_id: userId })
                });

                let result = await response.json();
                if (result.success) {
                    document.getElementById("balance").innerText = result.new_balance;
                    document.getElementById("streak-text").innerText = `Стрик: ${result.streak} дн.`;
                }
                notify(result.message);
            } catch (e) {
                notify("Ошибка подключения к серверу!");
            }
        }

        async function playUpgrade() {
            if (isSpinning) return;
            
            let userId = tg.initDataUnsafe?.user?.id;
            if (!userId) return notify("Запустите в Telegram!");

            let bet = parseInt(document.getElementById('bet-input').value) || 0;
            let target = parseInt(document.getElementById('target-input').value) || 0;

            if (bet <= 0 || target <= bet) {
                return notify("Укажите правильную ставку и цель!");
            }

            isSpinning = true;
            document.getElementById('upgrade-btn').innerText = "ВРАЩЕНИЕ...";

            try {
                let response = await fetch(`${SERVER_URL}/api/upgrade`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
                    body: JSON.stringify({ user_id: userId, bet: bet, target: target })
                });

                let result = await response.json();

                if (!result.success) {
                    notify(result.message);
                    isSpinning = false;
                    document.getElementById('upgrade-btn').innerText = "🚀 ПРОКАЧАТЬ";
                    return;
                }

                // Анимация вращения стрелки
                let rollDegree = (result.roll / 100) * 360; // Переводим выпавший процент в градусы
                let totalRotations = 360 * 5 + rollDegree; // 5 полных оборотов + итоговый угол

                let arrow = document.getElementById('wheel-arrow');
                arrow.style.transform = `rotate(${totalRotations}deg)`;

                setTimeout(() => {
                    document.getElementById("balance").innerText = result.new_balance;
                    notify(result.message);

                    // Сброс стрелки
                    arrow.style.transition = 'none';
                    arrow.style.transform = `rotate(${rollDegree}deg)`;
                    setTimeout(() => {
                        arrow.style.transition = 'transform 3s cubic-bezier(0.15, 0.9, 0.2, 1)';
                    }, 50);

                    isSpinning = false;
                    document.getElementById('upgrade-btn').innerText = "🚀 ПРОКАЧАТЬ";
                }, 3200);

            } catch (e) {
                notify("Ошибка подключения!");
                isSpinning = false;
                document.getElementById('upgrade-btn').innerText = "🚀 ПРОКАЧАТЬ";
            }
        }

        updateCalculations();
        loadUserData();
    </script>
</body>
</html>
